[project]
name = "obsidian-rag-langgraph"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pydantic-settings>=2.0",
    "structlog>=24.0",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "langgraph>=0.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.15",
    "mypy>=2.0",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    # 基本
    "E", "W", "F", "I", "UP", "B", "A", "RUF", "COM", "PTH",
    # セキュリティ
    "S",
    # print文検出
    "T20",
    # 命名規則（review-criteria: 命名規則）
    "N",
    # 関数の引数数制限（review-criteria: 引数4つ以内）
    "PLR0913",
    # 関数の文数制限（review-criteria: 30行以内の近似）
    "PLR0915",
    # 複雑度（review-criteria: 1関数1責務の補助指標）
    "C901",
    # bare except 禁止（review-criteria-backend: bare except 禁止）
    "BLE",
    # エラーメッセージ品質（review-criteria: エラーメッセージに文脈を含める）
    "EM",
    # f-string推奨（review-criteria-backend: f-string推奨）
    "FLY",
    # return文の簡素化
    "RET",
    # 不要な引数
    "ARG",
    # pytest スタイル
    "PT",
    # simplify
    "SIM",
    # 内包表記の最適化
    "C4",
    # 暗黙の文字列結合を検出
    "ISC",
    # 不要な pass/spread 等
    "PIE",
    # TYPE_CHECKING ブロックへの import 分離
    "TC",
]
ignore = ["D", "ANN", "ERA", "FIX", "TD", "E501", "RET504"]

[tool.ruff.lint.per-file-ignores]
"**/test_*.py" = ["S101", "N", "PLR0915", "PLR0913", "ARG"]
"shared/**" = ["S101"]

[tool.ruff.lint.pylint]
max-args = 4             # review-criteria: 引数4つ以内
max-statements = 20      # review-criteria: 30行以内（文数ベースの近似）

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
explicit_package_bases = true
mypy_path = "."
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["."]
norecursedirs = ["shared", ".venv", "__pycache__", ".mypy_cache", ".ruff_cache", ".git", "data", "docs"]
pythonpath = ["."]
addopts = "--import-mode=importlib"
