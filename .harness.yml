profiles:
  backend:
    lint: [ruff, mypy]
    test: pytest
    toolRoot: backend
    criteriaPreset: backend
    claude:
      defaultAgent: harness-backend-general
      defaultSkillBundles: [backend-core]
      stepOverrides:
        spec_generate:
          agent: harness-backend-design
        test_case_generate:
          agent: harness-backend-design
        test_generate:
          agent: harness-backend-test
          skillBundles: [backend-impl, backend-failure-modes]
        test_self_quality:
          agent: harness-backend-reviewer
          skillBundles: [backend-review-quality]
        test_external_review:
          agent: harness-backend-reviewer
          skillBundles: [backend-review-quality]
        impl_generate:
          agent: harness-backend-impl
          skillBundles: [backend-impl, backend-failure-modes]
        impl_self_criteria:
          agent: harness-backend-reviewer
          skillBundles: [backend-review-criteria]
        impl_self_quality:
          agent: harness-backend-reviewer
          skillBundles: [backend-review-quality]
        impl_external_review:
          agent: harness-backend-reviewer
          skillBundles: [backend-review-quality]
    sourceLayout:
      sourceDir: "backend/{{category}}"
      testDir: "backend/{{category}}/tests"
      scopePattern: "backend/{{category}}/*"
      additionalAllowedPrefixes: ["docs/reviews/"]
  frontend:
    lint: [eslint, tsc]
    test: vitest
    toolRoot: frontend
    criteriaPreset: frontend
    sourceLayout:
      sourceDir: "frontend/src/{{category}}/{{name}}"
      testDir: "frontend/src/{{category}}/{{name}}/__tests__"
      scopePattern: "frontend/src/{{category}}/{{name}}/*"
      additionalAllowedPrefixes: ["docs/reviews/", "frontend/src/mocks/handlers/"]

runners:
  claude:
    type: claude
  codex:
    type: codex
    sandbox: read-only

claude:
  skillBundles:
    backend-core:
      - harness-backend-core
    backend-impl:
      - harness-backend-impl
    backend-review-criteria:
      - harness-backend-review-criteria
    backend-review-quality:
      - harness-backend-review-quality
    backend-failure-modes:
      - harness-backend-failure-modes

flow: full
fallbackRunner: claude

steps:
  test_generate: claude
  test_self_quality: claude
  test_external_review: claude
  impl_generate: claude
  impl_self_criteria: claude
  impl_self_quality: claude
  impl_external_review: claude
  lint_fix: claude
  apply_fixes: claude
  judgment_summary: claude
  judge_minor: claude
  spec_generate: claude
  test_case_generate: claude
