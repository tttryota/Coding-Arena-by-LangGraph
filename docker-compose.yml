services:
  backend:
    build: ./backend
    restart: unless-stopped
    mem_limit: ${BACKEND_MEMORY_LIMIT:-4g}
    ports:
      - "8081:8001"
    volumes:
      - ./data:/app/data
      - ${HOME}/.codex:/root/.codex
    env_file:
      - .env

  frontend:
    build: ./frontend
    ports:
      - "3080:3000"
    depends_on:
      - backend
