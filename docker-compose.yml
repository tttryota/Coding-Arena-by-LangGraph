services:
  backend:
    build: ./backend
    ports:
      - "8081:8001"
    volumes:
      - ./data:/app/data
      - ./data/huggingface:/root/.cache/huggingface
      - ${HOME}/.codex:/root/.codex
      - ${VAULT_PATH}:/vault:ro
    depends_on:
      - chromadb
    env_file:
      - .env
    environment:
      - CHROMADB_HOST=chromadb

  frontend:
    build: ./frontend
    ports:
      - "3080:3000"
    depends_on:
      - backend

  chromadb:
    image: chromadb/chroma
    ports:
      - "8000:8000"
    volumes:
      - ./data/chromadb:/chroma/chroma
