profiles:
  backend:
    lint: [ruff, mypy]
    test: pytest
    toolRoot: backend
    exec: [uv, run, --with, pytest, --with, ruff, --with, mypy]
    criteriaPreset: backend
    context:
      defaultContextBundles: [backend-core]
      stepOverrides:
        spec_generate:
          contextBundles: [backend-impl]
        test_case_generate:
          contextBundles: [backend-impl]
        test_generate:
          contextBundles: [backend-impl, backend-failure-modes]
        test_self_quality:
          contextBundles: [backend-review-quality]
        test_external_review:
          contextBundles: [backend-review-quality]
        impl_generate:
          contextBundles: [backend-impl, backend-failure-modes]
        impl_self_criteria:
          contextBundles: [backend-review-criteria]
        impl_self_quality:
          contextBundles: [backend-review-quality]
        impl_external_review:
          contextBundles: [backend-review-quality]
    sourceLayout:
      sourceDir: "backend/{{category}}"
      testDir: "backend/{{category}}/tests"
      scopePattern: "backend/{{category}}/*"
      additionalAllowedPrefixes: ["docs/reviews/"]
  frontend:
    lint: [eslint, tsc]
    test: vitest
    toolRoot: frontend
    criteriaPreset: frontend
    sourceLayout:
      sourceDir: "frontend/src/{{category}}/{{name}}"
      testDir: "frontend/src/{{category}}/{{name}}/__tests__"
      scopePattern: "frontend/src/{{category}}/{{name}}/*"
      additionalAllowedPrefixes: ["docs/reviews/", "frontend/src/mocks/handlers/"]

runners:
  codex:
    type: codex
    sandbox: workspace-write
  claude:
    type: claude
  claude_benchmark_opus:
    type: claude
    model: opus

context:
  contextBundles:
    backend-core:
      - harness-backend-core
    backend-impl:
      - harness-backend-impl
    backend-review-criteria:
      - harness-backend-review-criteria
    backend-review-quality:
      - harness-backend-review-quality
    backend-failure-modes:
      - harness-backend-failure-modes

flow: full
fallbackRunner: codex

steps:
  test_generate: codex
  test_self_quality: codex
  test_external_review: claude_benchmark_opus
  impl_generate: codex
  impl_self_criteria: codex
  impl_self_quality: codex
  impl_external_review: claude_benchmark_opus
  lint_fix: codex
  apply_fixes: codex
  judgment_summary: codex
  judge_minor: codex
  spec_generate: codex
  test_case_generate: codex
